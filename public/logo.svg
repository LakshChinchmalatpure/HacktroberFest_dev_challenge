<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="cogAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#090d16" />
  <circle cx="50" cy="50" r="38" stroke="url(#cogGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.4" />
  <!-- Stylized C / Learning Infinity Spark -->
  <path d="M 68 32 C 60 22 40 22 32 32 C 22 42 22 58 32 68 C 40 78 60 78 68 68 C 72 63 74 57 74 50 L 50 50" 
        stroke="url(#cogGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Spark node -->
  <circle cx="50" cy="50" r="5" fill="#2dd4bf" filter="url(#glow)" />
  <circle cx="68" cy="32" r="3.5" fill="#818cf8" />
  <circle cx="68" cy="68" r="3.5" fill="#38bdf8" />
</svg>
